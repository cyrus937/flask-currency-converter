# docker-compose.yml - Version corrigée
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      # ✅ Port 5432 à l'intérieur du réseau Docker
      - DATABASE_URL=postgresql://postgres:password@db:5432/flask_auth_currency
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    networks:
      - flask_network
    # command: /bin/sh -c "flask run & sleep 10 && python populate_currencies.py && wait"
    
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=flask_auth_currency
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ✅ Correction: 5431 (externe) -> 5432 (interne)
      - "5431:5432"
    networks:
      - flask_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flask_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  celery:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/flask_auth_currency
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    networks:
      - flask_network
  
  celery-beat:
    build: .
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/flask_auth_currency
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    networks:
      - flask_network

# ✅ Ajout d'un réseau personnalisé pour une meilleure isolation
networks:
  flask_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: